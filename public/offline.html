<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — Vendor Day 2027</title>
    <meta name="theme-color" content="#2E8B57" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #222;
        background: #FAFAF8;
        line-height: 1.4;
      }
      .offline-card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 32px 24px;
        border-radius: 12px;
        background: #FFFFFF;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        box-sizing: border-box;
      }
      .offline-card img {
        display: block;
        margin: 0 auto 16px;
        width: 72px;
        height: auto;
      }
      .offline-card h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        color: #1F6B40;
      }
      .offline-card p {
        margin: 0 0 20px;
        color: #333;
        font-size: 1rem;
      }
      .offline-card button {
        min-height: 44px;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #2E8B57;
        color: #FFFFFF;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .offline-card button:focus-visible {
        outline: 2px solid #1F6B40;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="offline-card" role="main">
      <img src="/assets/brand/gateway-logo.svg" alt="Gateway Chapter SCTE" />
      <h1>You're offline</h1>
      <p>Some features aren't available right now. Reconnect to continue.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
