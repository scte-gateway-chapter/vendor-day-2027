<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" role="img" aria-labelledby="venue-map-placeholder-title" font-family="Roboto, Arial, sans-serif">
  <title id="venue-map-placeholder-title">Venue map placeholder — Doubletree Chesterfield Exhibit Hall</title>
  <defs>
    <pattern id="booth-grid" width="80" height="90" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="68" height="78" rx="3" ry="3" fill="#FFFFFF" stroke="#2E8B57" stroke-opacity="0.45" stroke-width="1.5"/>
    </pattern>
  </defs>
  <!-- Backdrop -->
  <rect width="1024" height="600" fill="#F7F7F7"/>
  <!-- Hall outline -->
  <rect x="48" y="48" width="928" height="504" rx="18" ry="18" fill="#EAF4EE" stroke="#2E8B57" stroke-width="3" stroke-opacity="0.6"/>
  <!-- North-wall specialty strip -->
  <rect x="72" y="72" width="880" height="40" rx="6" ry="6" fill="#FFFFFF" stroke="#2E8B57" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="512" y="99" text-anchor="middle" font-weight="600" font-size="18" fill="#1F6B40">North wall — specialty stations</text>
  <!-- Booth grid interior -->
  <rect x="72" y="130" width="880" height="360" fill="url(#booth-grid)"/>
  <!-- Registration strip near main doors -->
  <rect x="72" y="510" width="880" height="30" rx="6" ry="6" fill="#FFFFFF" stroke="#2E8B57" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="512" y="531" text-anchor="middle" font-weight="600" font-size="14" fill="#555">Registration Table — Main Doors</text>
  <!-- Centerpiece labels -->
  <text x="512" y="296" text-anchor="middle" font-weight="700" font-size="30" fill="#1F6B40">Doubletree Chesterfield Exhibit Hall</text>
  <text x="512" y="332" text-anchor="middle" font-weight="400" font-size="18" fill="#555">(placeholder — final floor plan posted before the event)</text>
</svg>
