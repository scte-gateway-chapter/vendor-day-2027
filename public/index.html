<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SCTE Gateway Chapter Vendor Day 2027</title>
    <meta name="theme-color" content="#2E8B57" />
    <!--
      iOS-specific PWA recognition tags. Without `apple-mobile-web-app-capable`,
      iOS 16.4+ Safari treats "Add to Home Screen" as a bookmark (opens in a
      Safari tab) instead of a standalone PWA. Bookmarks can NOT receive web
      push notifications on iOS — only installed-PWA mode can.
      `apple-mobile-web-app-status-bar-style` controls the status bar
      appearance in standalone mode; `black-translucent` lets the app paint
      under the status bar.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vendor Day 2027" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <!--
      Skip link: WCAG 2.4.1 Bypass Blocks. First focusable element on the
      page so screen reader + keyboard users can jump past the header /
      sticky overflow menu into the view. Hidden offscreen until focused.
    -->
    <a class="skip-link" href="#view-root">Skip to content</a>
    <div id="app">
      <header id="app-header"></header>
      <main id="view-root" tabindex="-1"></main>
      <nav id="app-tab-bar" aria-label="Main navigation"></nav>
    </div>
    <div id="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="banner-root"></div>
    <script src="/js/app.js" type="module"></script>
  </body>
</html>
